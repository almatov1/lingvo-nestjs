name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  VERSION: "0.0.1-${{ github.ref_name }}"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
      - run: npm test -- --passWithNoTests

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/lingvo-nestjs:latest
            ${{ secrets.DOCKER_USERNAME }}/lingvo-nestjs:${{ env.VERSION }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |            
            echo "Logging into Docker..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "Stopping old container..."
            docker stop lingvo-nestjs || true
            docker rm lingvo-nestjs || true

            echo "Cleaning images..."
            docker image prune -f

            echo "Pulling latest image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/lingvo-nestjs:latest

            echo "Starting container..."
            docker run -d --name lingvo-nestjs --restart unless-stopped -p 3000:3000 \
              --network lingvo-net \
              -e DATABASE_URL="postgresql://${{ secrets.POSTGRESQL_USER }}:${{ secrets.POSTGRESQL_PASSWORD }}@postgres_lingvo:${{ secrets.POSTGRESQL_PORT }}/${{ secrets.POSTGRESQL_DB }}?schema=public" \
              -e TELEGRAM_TOKEN="${{ secrets.TELEGRAM_TOKEN }}" \
              -v /var/lib/lingvo/storage:/usr/src/app/storage \
              ${{ secrets.DOCKER_USERNAME }}/lingvo-nestjs
              